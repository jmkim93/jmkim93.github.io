6 209" stroke="#d8dde0" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M604 167.6L688 142.4" stroke="#496b92" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M604 192.8L688 117.19999999999999" stroke="#aa663d" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="646" cy="155" r="3" stroke="#827097" stroke-width="2" fill="white"/><text x="646" y="239" font-size="15" fill="#30383e" text-anchor="middle" font-weight="400">Type II</text><path d="M743 155L837 155" stroke="#d8dde0" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M790 102L790 209" stroke="#d8dde0" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M748 155L832 155" stroke="#496b92" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M748 192.8L832 117.19999999999999" stroke="#aa663d" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="790" cy="155" r="3" stroke="#827097" stroke-width="2" fill="white"/><text x="790" y="239" font-size="15" fill="#30383e" text-anchor="middle" font-weight="400">Type III</text><text x="450" y="295" font-size="14" fill="#69737b" text-anchor="middle" font-weight="400">Relative modal frequencies determine the local dispersion near a crossing.</text></svg>