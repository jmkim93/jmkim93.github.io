<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 335" role="img" aria-labelledby="drawing-title drawing-desc" font-family="Arial,Helvetica,sans-serif"><title id="drawing-title">Coupled resonators with two persistent states</title><desc id="drawing-desc">A neutral resonator couples nonlinear gain and loss resonators. Optical control switches the system between stable intensity distributions. The rings identify coupled modes, not a fabricated device.</desc><rect width="900" height="335" fill="white"/><text x="450" y="38" font-size="18" fill="#30383e" text-anchor="middle" font-weight="600">A stable intensity pattern stores the bit</text><circle cx="206" cy="142" r="38" stroke="#496b92" stroke-width="2" fill="#f4f6f8"/><circle cx="206" cy="142" r="23" stroke="#496b92" stroke-width="2" fill="white"/><text x="206" y="208" font-size="16" fill="#496b92" text-anchor="middle" font-weight="400">Gain</text><circle cx="450" cy="142" r="38" stroke="#69737b" stroke-width="2" fill="#f4f6f8"/><circle cx="450" cy="142" r="23" stroke="#69737b" stroke-width="2" fill="white"/><text x="450" y="208" font-size="16" fill="#69737b" text-anchor="middle" font-weight="400">Neutral</text><circle cx="694" cy="142" r="38" stroke="#aa663d" stroke-width="2" fill="#f4f6f8"/><circle cx="694" cy="142" r="23" stroke="#aa663d" stroke-width="2" fill="white"/><text x="694" y="208" font-size="16" fill="#aa663d" text-anchor="middle" font-weight="400">Loss</text><path d="M245 142L409 142" stroke="#69737b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M489 142L655 142" stroke="#69737b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="327" y="126" font-size="18" fill="#69737b" text-anchor="middle" font-weight="400">κ</text><text x="571" y="126" font-size="18" fill="#69737b" text-anchor="middle" font-weight="400">κ</text><text x="206" y="232" font-size="13" fill="#69737b" text-anchor="middle" font-weight="400">Saturable</text><text x="694" y="232" font-size="13" fill="#69737b" text-anchor="middle" font-weight="400">Saturable</text><rect x="244" y="265" width="107" height="41" rx="6" fill="#edf2f8" stroke="#496b92" stroke-width="1.4"/><text x="297.5" y="290.5" font-size="15" fill="#30383e" text-anchor="middle" font-weight="400">State 0</text><rect x="550" y="265" width="107" height="41" rx="6" fill="#f6eee8" stroke="#aa663d" stroke-width="1.4"/><text x="603.5" y="290.5" font-size="15" fill="#30383e" text-anchor="middle" font-weight="400">State 1</text><path d="M364 278L536 278" stroke="#496b92" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M-7 -4L0 0L-7 4" fill="none" stroke="#496b92" stroke-width="2" transform="translate(536 278) rotate(0.0)"/><path d="M536 295L364 295" stroke="#aa663d" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M-7 -4L0 0L-7 4" fill="none" stroke="#aa663d" stroke-width="2" transform="translate(364 295) rotate(180.0)"/><text x="451" y="254" font-size="13" fill="#69737b" text-anchor="middle" font-weight="400">Optical control</text></svg>