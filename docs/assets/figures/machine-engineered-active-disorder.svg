<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 335" role="img" aria-labelledby="drawing-title drawing-desc" font-family="Arial,Helvetica,sans-serif"><title id="drawing-title">Design disorder around a switchable material</title><desc id="drawing-desc">A neural inverse model selects layer thicknesses for the desired optical response and controllability. Switching the central GST layer between amorphous and crystalline phases changes the response. Only a few layers are drawn.</desc><rect width="900" height="335" fill="white"/><text x="50" y="46" font-size="17" fill="#30383e" text-anchor="start" font-weight="600">Choose a response</text><rect x="50" y="106" width="182" height="106" rx="6" fill="#f5f6f8" stroke="#d8dde0" stroke-width="1.4"/><text x="141" y="147" font-size="16" fill="#30383e" text-anchor="middle" font-weight="400">Transmission</text><text x="141" y="178" font-size="16" fill="#30383e" text-anchor="middle" font-weight="400">Controllability</text><path d="M244 159L289 159" stroke="#30383e" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M-7 -4L0 0L-7 4" fill="none" stroke="#30383e" stroke-width="2" transform="translate(289 159) rotate(0.0)"/><rect x="303" y="113" width="169" height="92" rx="6" fill="#f0edf4" stroke="#827097" stroke-width="1.4"/><text x="388" y="150" font-size="17" fill="#827097" text-anchor="middle" font-weight="400">Neural inverse</text><text x="388" y="177" font-size="17" fill="#827097" text-anchor="middle" font-weight="400">design</text><path d="M484 159L536 159" stroke="#30383e" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M-7 -4L0 0L-7 4" fill="none" stroke="#30383e" stroke-width="2" transform="translate(536 159) rotate(0.0)"/><rect x="557" y="87" width="17" height="147" rx="0" fill="#d8e1eb" stroke="#98a5af" stroke-width="1.4"/><rect x="574" y="87" width="20" height="147" rx="0" fill="#f3f5f6" stroke="#98a5af" stroke-width="1.4"/><rect x="594" y="87" width="14" height="147" rx="0" fill="#d8e1eb" stroke="#98a5af" stroke-width="1.4"/><rect x="608" y="87" width="23" height="147" rx="0" fill="#f3f5f6" stroke="#98a5af" stroke-width="1.4"/><rect x="631" y="87" width="39" height="147" rx="0" fill="#d9af98" stroke="#98a5af" stroke-width="1.4"/><rect x="670" y="87" width="23" height="147" rx="0" fill="#f3f5f6" stroke="#98a5af" stroke-width="1.4"/><rect x="693" y="87" width="14" height="147" rx="0" fill="#d8e1eb" stroke="#98a5af" stroke-width="1.4"/><rect x="707" y="87" width="20" height="147" rx="0" fill="#f3f5f6" stroke="#98a5af" stroke-width="1.4"/><rect x="727" y="87" width="17" height="147" rx="0" fill="#d8e1eb" stroke="#98a5af" stroke-width="1.4"/><text x="651" y="56" font-size="17" fill="#30383e" text-anchor="middle" font-weight="600">Active multilayer</text><path d="M650 237L650 267" stroke="#aa663d" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="650" y="289" font-size="15" fill="#aa663d" text-anchor="middle" font-weight="400">GST: amorphous ↔ crystalline</text><text x="388" y="256" font-size="14" fill="#69737b" text-anchor="middle" font-weight="400">Design the layer thicknesses</text></svg>