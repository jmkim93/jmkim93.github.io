<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 335" role="img" aria-labelledby="drawing-title drawing-desc" font-family="Arial,Helvetica,sans-serif"><title id="drawing-title">Small thickness changes reshape light transport</title><desc id="drawing-desc">The structure alternates two dielectric materials, with deliberately varied subwavelength layer thicknesses. Under oblique illumination, those variations change reflection, transmission, localization, and beam shifts.</desc><rect width="900" height="335" fill="white"/><text x="42" y="46" font-size="17" fill="#30383e" text-anchor="start" font-weight="600">Oblique illumination</text><text x="408" y="46" font-size="17" fill="#30383e" text-anchor="start" font-weight="600">Thickness disorder</text><path d="M67 270L312 171" stroke="#496b92" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M-7 -4L0 0L-7 4" fill="none" stroke="#496b92" stroke-width="3" transform="translate(312 171) rotate(-22.00272903561907)"/><path d="M312 171L134 91" stroke="#aa663d" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M-7 -4L0 0L-7 4" fill="none" stroke="#aa663d" stroke-width="2" transform="translate(134 91) rotate(-155.7990284088415)"/><rect x="313" y="91" width="14" height="158" rx="0" fill="#d8e1eb" stroke="#98a5af" stroke-width="1.4"/><rect x="327" y="91" width="22" height="158" rx="0" fill="#f3f5f6" stroke="#98a5af" stroke-width="1.4"/><rect x="349" y="91" width="10" height="158" rx="0" fill="#d8e1eb" stroke="#98a5af" stroke-width="1.4"/><rect x="359" y="91" width="28" height="158" rx="0" fill="#f3f5f6" stroke="#98a5af" stroke-width="1.4"/><rect x="387" y="91" width="18" height="158" rx="0" fill="#d8e1eb" stroke="#98a5af" stroke-width="1.4"/><rect x="405" y="91" width="35" height="158" rx="0" fill="#f3f5f6" stroke="#98a5af" stroke-width="1.4"/><rect x="440" y="91" width="13" height="158" rx="0" fill="#d8e1eb" stroke="#98a5af" stroke-width="1.4"/><rect x="453" y="91" width="22" height="158" rx="0" fill="#f3f5f6" stroke="#98a5af" stroke-width="1.4"/><rect x="475" y="91" width="16" height="158" rx="0" fill="#d8e1eb" stroke="#98a5af" stroke-width="1.4"/><rect x="491" y="91" width="27" height="158" rx="0" fill="#f3f5f6" stroke="#98a5af" stroke-width="1.4"/><path d="M519 171L653 107" stroke="#496b92" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M-7 -4L0 0L-7 4" fill="none" stroke="#496b92" stroke-width="3" transform="translate(653 107) rotate(-25.529697990533045)"/><text x="94" y="295" font-size="14" fill="#496b92" text-anchor="start" font-weight="400">Input</text><text x="112" y="77" font-size="14" fill="#aa663d" text-anchor="start" font-weight="400">Reflection</text><text x="667" y="109" font-size="16" fill="#496b92" text-anchor="start" font-weight="400">Transmission</text><path d="M313 252L521 252" stroke="#69737b" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="418" y="279" font-size="14" fill="#69737b" text-anchor="middle" font-weight="400">Alternating εL and εH</text><text x="694" y="222" font-size="17" fill="#30383e" text-anchor="middle" font-weight="600">Transport changes</text><text x="601" y="250" font-size="14" fill="#69737b" text-anchor="start" font-weight="400">Localization and beam shifts</text><text x="601" y="271" font-size="14" fill="#69737b" text-anchor="start" font-weight="400">depend on the disorder.</text></svg>