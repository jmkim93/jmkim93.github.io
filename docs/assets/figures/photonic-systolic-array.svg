<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 355" role="img" aria-labelledby="drawing-title drawing-desc" font-family="Arial,Helvetica,sans-serif"><title id="drawing-title">Orthogonal inputs and temporal accumulation</title><desc id="drawing-desc">Two synchronized optical inputs enter through perpendicular waveguides. Balanced detection produces their product; temporal integration yields one entry of C = AᵀB. Routing inside the cell is schematic.</desc><rect width="900" height="355" fill="white"/><text x="48" y="45" font-size="17" fill="#30383e" text-anchor="start" font-weight="600">Orthogonal optical inputs</text><path d="M57 146h12v-15h10v15h15v-23h10v23h15v-10h10v10h12" stroke="#aa663d" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="177" y="139" font-size="16" fill="#aa663d" text-anchor="start" font-weight="400">Bₙ(t)</text><path d="M240 141L331 141" stroke="#aa663d" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M-7 -4L0 0L-7 4" fill="none" stroke="#aa663d" stroke-width="2.5" transform="translate(331 141) rotate(0.0)"/><rect x="334" y="96" width="175" height="94" rx="6" fill="#f0edf4" stroke="#827097" stroke-width="1.4"/><text x="421" y="132" font-size="16" fill="#827097" text-anchor="middle" font-weight="400">Mix + balanced</text><text x="421" y="157" font-size="16" fill="#827097" text-anchor="middle" font-weight="400">detection</text><path d="M421 292v-10h-12v-10h12v-10h-20v-10h20v-12" stroke="#496b92" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M421 230L421 191" stroke="#496b92" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M-7 -4L0 0L-7 4" fill="none" stroke="#496b92" stroke-width="2.5" transform="translate(421 191) rotate(-90.0)"/><text x="445" y="265" font-size="16" fill="#496b92" text-anchor="start" font-weight="400">Aₘ(t)</text><path d="M519 142L563 142" stroke="#30383e" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M-7 -4L0 0L-7 4" fill="none" stroke="#30383e" stroke-width="2" transform="translate(563 142) rotate(0.0)"/><rect x="577" y="101" width="122" height="82" rx="6" fill="#edf2f8" stroke="#496b92" stroke-width="1.4"/><text x="638.0" y="147.0" font-size="15" fill="#30383e" text-anchor="middle" font-weight="400">∫ dt</text><path d="M710 142L759 142" stroke="#30383e" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M-7 -4L0 0L-7 4" fill="none" stroke="#30383e" stroke-width="2" transform="translate(759 142) rotate(0.0)"/><rect x="773" y="112" width="83" height="61" rx="6" fill="white" stroke="#d8dde0" stroke-width="1.4"/><text x="814.5" y="147.5" font-size="15" fill="#30383e" text-anchor="middle" font-weight="400">Cₘₙ</text><text x="641" y="221" font-size="14" fill="#69737b" text-anchor="middle" font-weight="400">Accumulate in time</text><text x="450" y="332" font-size="17" fill="#496b92" text-anchor="middle" font-weight="400">ΔI ∝ Aₘ(t)Bₙ(t)    →    Cₘₙ = Σₖ AₖₘBₖₙ</text></svg>